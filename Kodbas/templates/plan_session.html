{% extends "base.html" %}

{% block title %}Planera pass - {{ athlete.name }}{% endblock %}

{% block content %}
<div class="plan-session-page">
    <div class="back-link">
        <a href="{{ url_for('athlete_detail', athlete_id=athlete.id) }}">← Tillbaka till {{ athlete.name }}</a>
    </div>

    <h1>Planera träningspass</h1>
    <p class="subtitle">{{ athlete.name }} · {{ athlete.discipline }}</p>

    <form method="POST" class="plan-form" id="custom-form">
        <div class="form-row">
            <div class="form-group">
                <label for="custom_date">Datum</label>
                <input type="date" id="custom_date" name="date" value="{{ today }}" required>
            </div>
            <div class="form-group">
                <label for="custom_name">Passnamn</label>
                <input type="text" id="custom_name" name="session_name" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="custom_type">Passtyp</label>
                <select id="custom_type" name="session_type" required>
                    <option value="uthållighet">Uthållighet</option>
                    <option value="snabbhet">Snabbhet</option>
                    <option value="teknik">Teknik</option>
                    <option value="tävling">Tävling</option>
                </select>
            </div>
            <div class="form-group">
                <label for="custom_duration">Varaktighet (minuter)</label>
                <input type="number" id="custom_duration" name="duration"
                       min="10" max="300" value="60" required>
            </div>
        </div>

        <div class="form-group">
            <label for="custom_intensity">Intensitet</label>
            <div class="intensity-selector">
                <label class="intensity-option">
                    <input type="radio" name="intensity" value="låg" checked>
                    <span class="intensity-card intensity-låg">
                        <span class="intensity-name">Låg</span>
                        <span class="intensity-desc">Återhämtning, lugnt tempo</span>
                    </span>
                </label>
                <label class="intensity-option">
                    <input type="radio" name="intensity" value="medel">
                    <span class="intensity-card intensity-medel">
                        <span class="intensity-name">Medel</span>
                        <span class="intensity-desc">Måttlig ansträngning</span>
                    </span>
                </label>
                <label class="intensity-option">
                    <input type="radio" name="intensity" value="hög">
                    <span class="intensity-card intensity-hög">
                        <span class="intensity-name">Hög</span>
                        <span class="intensity-desc">Maximal ansträngning</span>
                    </span>
                </label>
            </div>
        </div>

        <div class="form-group">
            <label for="custom_description">Passbeskrivning</label>
            <textarea id="custom_description" name="description" rows="4"
                      placeholder="Beskriv passet i detalj: uppvärmning, huvuddel, nedvarvning..."></textarea>
            <span class="form-hint">Tips: Var tydlig med rep, set, distanser, tider etc.</span>
        </div>

        <!-- Dynamisk övningslista -->
        <div class="form-group">
            <label>Övningar (valfritt)</label>
            <div class="exercises-builder" id="exercises-builder">
                <div class="exercise-row" data-index="0">
                    <input type="text" name="exercises[0][name]" placeholder="Övningsnamn" class="exercise-name">
                    <input type="text" name="exercises[0][details]" placeholder="T.ex. 3x10, 5 min, 4x100m" class="exercise-details">
                    <button type="button" class="btn-icon remove-exercise" title="Ta bort">×</button>
                </div>
            </div>
            <button type="button" class="btn btn-small btn-outline" id="add-exercise">+ Lägg till övning</button>
        </div>

        <div class="form-group">
            <label for="custom_notes">Anteckningar till idrottaren</label>
            <textarea id="custom_notes" name="coach_notes" rows="3"
                      placeholder="Extra instruktioner, tips, saker att tänka på..."></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-large">Lägg till i plan</button>
            <a href="{{ url_for('athlete_detail', athlete_id=athlete.id) }}" class="btn btn-secondary btn-large">Avbryt</a>
        </div>
    </form>

</div>

<script>
// Lägg till övning
let exerciseIndex = 1;
document.getElementById('add-exercise').addEventListener('click', function() {
    const builder = document.getElementById('exercises-builder');
    const row = document.createElement('div');
    row.className = 'exercise-row';
    row.dataset.index = exerciseIndex;
    row.innerHTML = `
        <input type="text" name="exercises[${exerciseIndex}][name]" placeholder="Övningsnamn" class="exercise-name">
        <input type="text" name="exercises[${exerciseIndex}][details]" placeholder="T.ex. 3x10, 5 min, 4x100m" class="exercise-details">
        <button type="button" class="btn-icon remove-exercise" title="Ta bort">×</button>
    `;
    builder.appendChild(row);
    exerciseIndex++;
});

// Ta bort övning
document.getElementById('exercises-builder').addEventListener('click', function(e) {
    if (e.target.classList.contains('remove-exercise')) {
        const rows = this.querySelectorAll('.exercise-row');
        if (rows.length > 1) {
            e.target.closest('.exercise-row').remove();
        }
    }
});

// Sätt datum från URL om det finns
const urlParams = new URLSearchParams(window.location.search);
const dateParam = urlParams.get('date');
if (dateParam) {
    document.getElementById('custom_date').value = dateParam;
}
</script>
{% endblock %}
